<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speak Up - Emotional Faces</title>
    <link rel="stylesheet" href="../styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="app-container">
        <header>
            <a href="../index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Games</a>
            <h1>Emotional Faces 😊</h1>
            <p>Tell the robot how you feel! Say "Happy", "Sad", or "Angry".</p>
        </header>

        <main class="game-area">
            <div class="character-stage character-stage-tall">
                <img id="robot-canvas" class="robot-canvas" src="../assets/robot_neutral.png" alt="Robot">
            </div>

            <div class="controls">
                <button id="mic-btn" class="ready">
                    <i class="fa-solid fa-microphone-lines"></i>
                    <span id="mic-status">Tap to Talk</span>
                </button>
            </div>

            <div class="recognition-feedback">
                <p>Emotion heard: <span id="heard-word">...</span></p>
            </div>
        </main>
    </div>

    <script src="../utils.js"></script>
    <script src="faces.js"></script>
</body>

</html>
